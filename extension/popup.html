<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Plain English</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 320px;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--rule);
      }

      .name {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--serif);
        font-size: 16px;
        font-weight: 700;
      }

      .name img {
        width: 20px;
        height: 20px;
      }

      .body {
        padding: 16px 16px 18px;
      }

      .total {
        font-family: var(--serif);
        font-size: 34px;
        line-height: 1.05;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .total small {
        font-size: 17px;
        letter-spacing: 0;
      }

      .paused .total {
        color: var(--graphite);
      }

      .line {
        margin-top: 6px;
        color: var(--graphite);
      }

      .notice {
        font-family: var(--serif);
        font-size: 18px;
        line-height: 1.3;
        font-weight: 700;
      }

      .notice + .line {
        margin-bottom: 14px;
      }

      .page {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px dashed var(--rule);
        color: var(--graphite);
        font-size: 13px;
      }

      .foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 16px;
        border-top: 1px solid var(--rule);
        color: var(--graphite);
      }
    </style>
  </head>
  <body>
    <div class="top">
      <span class="name"><img src="icons/icon-48.png" alt="" />Plain English</span>
      <label class="switch" title="Translate long posts on LinkedIn">
        <span id="switch-label">On</span>
        <input id="enabled" type="checkbox" role="switch" checked />
      </label>
    </div>
    <main class="body" id="body" aria-live="polite"></main>
    <div class="foot">
      <a href="options.html" target="_blank" id="settings">Settings</a>
      <span id="saved" class="num"></span>
    </div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
